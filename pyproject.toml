[project]
name = "freitask-mcp"
version = "0.1.0"
description = "As tools do freitask para o claude.ai: embrulha a CLI do freitask num servidor MCP, local em stdio e remoto em HTTP com OAuth"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9,<2",
]

[project.scripts]
freitask-mcp = "freitask_mcp.local:main"
freitask-mcp-http = "freitask_mcp.remoto:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freitask_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
